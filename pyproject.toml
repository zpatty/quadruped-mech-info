[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slip-passive-info"
version = "0.1.0"
description = "Information-theoretic comparison of robot actuator transmissions."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.15", "matplotlib>=3.10", "mujoco>=3.12"]

# Pinned, because these three produced the committed runs and a floating stack would make a
# mismatch ambiguous between "the move broke something" and "warp changed".
[project.optional-dependencies]
sim = ["torch==2.11.0", "warp-lang==1.16.0", "mujoco-warp==3.12.0"]
# Rendering for `python -m passive_info.anim`. Headless MuJoCo also needs a software GL
# (libegl1 + libgl1-mesa-dri, or libosmesa6) and ffmpeg on the PATH.
anim = ["pillow>=10", "opencv-python-headless>=4.10"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
slip-passive = "passive_info.run_passive:main"
slip-controlled = "passive_info.run_controlled:main"
slip-validate-critic = "passive_info.validate_critic:main"
slip-validate-gpu = "passive_info.validate_gpu_estimator:main"

[tool.setuptools.packages.find]
include = ["mechinfo*", "passive_info*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
